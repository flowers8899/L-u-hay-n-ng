<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý món - Tiệm Lẩu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="store-banner">
      <h2>⚙️ Quản lý thực đơn</h2>
    </div>

    <div class="quest-box">
      <h3>Thêm món mới</h3>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <input type="text" id="itemName" placeholder="Tên món" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
        <input type="text" id="itemImg" placeholder="URL ảnh minh họa (PNG)" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
        <select id="itemCat" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
          <option value="broth">Nước lẩu</option>
          <option value="topping">Topping / Đồ nướng</option>
        </select>
        <input type="number" id="itemPrice" placeholder="Giá bán (đ)" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
        <input type="number" id="itemCost" placeholder="Giá vốn (đ)" style="padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
        <button class="btn-primary" onclick="addNewItem()">Thêm vào Menu</button>
      </div>
    </div>

    <button class="btn-secondary" onclick="location.href='index.html'" style="width: 100%;">⬅️ Quay lại Game</button>
    <button class="btn-primary" onclick="resetDefaultData()" style="width: 100%; margin-top: 8px; background: #d9534f;">🔄 Khôi phục dữ liệu gốc</button>
  </div>

  <script src="data.js"></script>
  <script>
    function addNewItem() {
      let name = document.getElementById("itemName").value;
      let img = document.getElementById("itemImg").value || "https://cdn-icons-png.flaticon.com/512/3081/3081829.png";
      let cat = document.getElementById("itemCat").value;
      let price = parseInt(document.getElementById("itemPrice").value) || 20000;
      let cost = parseInt(document.getElementById("itemCost").value) || 8000;

      if (!name) return alert("Vui lòng nhập tên món!");

      let localData = JSON.parse(localStorage.getItem("lhg_data") || "null") || DEFAULT_DATA;
      let newId = cat[0] + Date.now();
      
      localData[cat].push({ id: newId, name, img, price, cost, unlock: 1 });
      localStorage.setItem("lhg_data", JSON.stringify(localData));
      
      alert("Đã thêm món mới thành công!");
      location.href = "index.html";
    }

    function resetDefaultData() {
      if (confirm("Xác nhận xóa hết dữ liệu và khôi phục mặc định?")) {
        localStorage.removeItem("lhg_data");
        localStorage.removeItem("lhg_state");
        alert("Đã khôi phục mặc định!");
        location.href = "index.html";
      }
    }
  </script>
</body>
</html>
