<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiệm Lẩu & Nướng</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- THANH TRÊN CÙNG -->
    <header class="game-header">
      <div class="day-info">
        <span id="dayTitle">Ngày 1</span>
        <small id="dayStatus">Chuẩn bị</small>
      </div>
      <div class="vault-info">
        <div class="label">KẾT</div>
        <div class="val" id="moneyDisplay">250.0k</div>
      </div>
      <div class="rating-info">
        ⭐ <span id="ratingDisplay">Chưa có</span>
      </div>
    </header>

    <!-- MÀN HÌNH 1: CHUẨN BỊ -->
    <div id="prepScreen" class="screen active">
      <div class="store-banner">
        <h2>Tiệm Lẩu & Nướng</h2>
        <div class="banner-sub">Cấp 1 • Quán Mới Mở</div>
      </div>

      <nav class="sub-nav">
        <button id="tabBtnStock" class="nav-btn tab-btn active" onclick="switchPrepTab('stock')">📦 Kho hàng</button>
        <button id="tabBtnReviews" class="nav-btn tab-btn" onclick="switchPrepTab('reviews')">💬 Đánh giá khách</button>
        <button class="nav-btn" onclick="location.href='admin.html'">⚙️ Quản lý</button>
      </nav>

      <!-- TAB KHO HÀNG -->
      <div id="tabStock" class="tab-content">
        <div class="quest-box">
          <h3>Nhiệm vụ hôm nay</h3>
          <div id="questList"></div>
        </div>

        <div class="section-title">Danh sách nhập kho</div>
        <div class="stock-list" id="stockBuyList"></div>
      </div>

      <!-- TAB ĐÁNH GIÁ CỦA KHÁCH -->
      <div id="tabReviews" class="tab-content" style="display: none;">
        <div class="section-title">Nhận xét từ khách hàng</div>
        <div id="reviewsList"></div>
      </div>

      <button class="btn-primary" onclick="startSellingDay()" style="margin-top: 14px;">🚀 Mở cửa bán hàng</button>
    </div>

    <!-- MÀN HÌNH 2: BÁN HÀNG -->
    <div id="sellScreen" class="screen">
      <div class="customer-box">
        <div class="avatar">👩🏻</div>
        <div class="customer-bubble" id="customerDemand">
          "Cho anh 1 nồi lẩu Mala thêm Phô mai nha!"
        </div>
      </div>

      <div class="item-grid" id="gridItems"></div>

      <div class="cart-bar">
        <div><b>Đã chọn:</b> <span id="selectedItemsText">Chưa chọn món nào</span></div>
        <div class="action-btns">
          <button class="btn-serve" onclick="serveCustomer()">🍽️ Giao món</button>
          <button class="btn-secondary" onclick="endDay()">🌙 Kết thúc ngày</button>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
